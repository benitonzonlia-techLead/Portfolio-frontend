<div class="projects-section">
  <h2 class="section-title">Projets réalisés</h2>

  <div class="filters">
    <label>
      Stack&nbsp;:
      <select [(ngModel)]="selectedStack">
        <option value="">Toutes</option>
        <option *ngFor="let stack of stacks" [value]="stack">{{ stack }}</option>
      </select>
    </label>
    <label>
      Rôle&nbsp;:
      <select [(ngModel)]="selectedRole">
        <option value="">Tous</option>
        <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
      </select>
    </label>
  </div>

  <div class="projects-grid">
  <div class="project-card" *ngFor="let project of filteredProjects" [@fadeSlideUp]>
      <div class="project-header">
        <span class="client">{{ project.client }}</span>
        <span class="period">{{ project.period }}</span>
      </div>
      <div class="project-role">{{ project.role }}</div>
      <div class="project-mission">{{ project.mission }}</div>
      <div class="project-stack">
        <span *ngFor="let tech of project.stack" class="stack-item">{{ tech }}</span>
      </div>
      <div class="project-impact">{{ project.impact }}</div>
    </div>
  </div>
</div>
