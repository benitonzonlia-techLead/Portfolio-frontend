<div class="contact-section">
  <h2 class="section-title">
    <span class="fr">Contactez-moi</span> / <span class="en">Get in touch</span>
  </h2>
  <div class="contact-content">
    <form class="contact-form" (ngSubmit)="onSubmit()" #contactForm="ngForm" autocomplete="off">
      <div class="form-group">
        <label for="name">Nom / Name</label>
        <input id="name" name="name" [(ngModel)]="name" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" [(ngModel)]="email" required type="email" />
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" [(ngModel)]="message" required rows="4"></textarea>
      </div>
      <div class="form-actions">
  <button type="submit" class="send-btn" [@fadeScale]>
          <span class="fr">Envoyer</span> / <span class="en">Send</span>
        </button>
      </div>
      <div class="form-error" *ngIf="error">{{ error }}</div>
      <div class="form-success" *ngIf="submitted && !error">
        <span class="fr">Merci pour votre message !</span>
        <span class="en">Thank you for your message!</span>
      </div>
    </form>
    <div class="calendly-section">
      <h3 class="calendly-title">
        <span class="fr">Réservez un créneau</span> / <span class="en">Book a slot</span>
      </h3>
      <iframe src="https://calendly.com/benito-nzonlia/30min" width="100%" height="480" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
    </div>
  </div>
</div>
