<div class="insight-section">
  <h2 class="section-title">Insights</h2>
  <div class="insight-list">
    <div class="insight-card" *ngFor="let insight of insights">
      <div class="insight-header">
        <span class="insight-title">{{ insight.title }}</span>
        <span class="insight-date">{{ insight.date | date:'dd/MM/yyyy' }}</span>
      </div>
      <div class="insight-summary">{{ insight.summary }}</div>
      <div class="insight-actions">
        <a *ngIf="insight.link" [href]="insight.link" class="read-more-btn">Lire plus</a>
      </div>
    </div>
  </div>
</div>
